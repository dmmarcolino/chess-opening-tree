name: Atualizar árvore de aberturas

on:
  schedule:
    # toda segunda-feira as 08:00 UTC (05:00 no horario de Brasilia)
    - cron: "0 8 * * 1"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar nicks cadastrados no site
        run: |
          python scripts/fetch_config.py \
            --apps-script-url "${{ secrets.APPS_SCRIPT_URL }}" \
            --output data/config.json

      - name: Baixar partidas do Lichess (incremental, um arquivo por nick)
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          mkdir -p data/raw
          for nick in $(python -c "import json; print('\n'.join(json.load(open('data/config.json'))['lichess']))"); do
            since=$(python scripts/fetch_state.py get lichess "$nick")
            if [ -n "$since" ]; then
              # margem de seguranca de 7 dias (o merge com deduplicacao cuida de
              # qualquer sobreposicao -- e melhor buscar de novo umas partidas
              # que ja tinhamos do que arriscar perder alguma por uma borda de data)
              since=$(python -c "from datetime import datetime, timedelta; print((datetime.strptime('$since','%Y-%m-%d') - timedelta(days=7)).strftime('%Y-%m-%d'))")
              echo "Baixando Lichess: $nick (incremental, desde $since)"
              python scripts/fetch_lichess.py "$nick" --output "data/raw/lichess_${nick}.pgn" --since "$since"
            else
              echo "Baixando Lichess: $nick (primeira vez, historico completo)"
              python scripts/fetch_lichess.py "$nick" --output "data/raw/lichess_${nick}.pgn"
            fi
            python scripts/fetch_state.py set lichess "$nick" "$(date -u +%Y-%m-%d)"
          done

      - name: Baixar partidas do Chess.com (incremental, um arquivo por nick)
        env:
          CHESSCOM_CONTACT_EMAIL: ${{ secrets.CHESSCOM_CONTACT_EMAIL }}
        run: |
          for nick in $(python -c "import json; print('\n'.join(json.load(open('data/config.json'))['chesscom']))"); do
            since=$(python scripts/fetch_state.py get chesscom "$nick")
            if [ -n "$since" ]; then
              echo "Baixando Chess.com: $nick (incremental, desde $since)"
              python scripts/fetch_chesscom.py "$nick" \
                --email "${{ secrets.CHESSCOM_CONTACT_EMAIL }}" \
                --output "data/raw/chesscom_${nick}.pgn" \
                --since "$since"
            else
              echo "Baixando Chess.com: $nick (primeira vez, historico completo)"
              python scripts/fetch_chesscom.py "$nick" \
                --email "${{ secrets.CHESSCOM_CONTACT_EMAIL }}" \
                --output "data/raw/chesscom_${nick}.pgn"
            fi
            python scripts/fetch_state.py set chesscom "$nick" "$(date -u +%Y-%m)"
          done

      - name: Construir arvore de aberturas
        run: |
          LICHESS_NICKS=$(python -c "import json; print(' '.join(json.load(open('data/config.json'))['lichess']))")
          CHESSCOM_NICKS=$(python -c "import json; print(' '.join(json.load(open('data/config.json'))['chesscom']))")
          python scripts/build_tree.py \
            --lichess-username $LICHESS_NICKS \
            --chesscom-username $CHESSCOM_NICKS \
            --lichess-pgn-glob "data/raw/lichess_*.pgn" \
            --chesscom-pgn-glob "data/raw/chesscom_*.pgn" \
            --output-dir data

      - name: Commitar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "Nada novo para commitar" || \
            git commit -m "Atualiza dados de partidas ($(date -u +'%Y-%m-%d'))"
          git push
